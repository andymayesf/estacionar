<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escuela de Estacionamiento</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: escenario (vista aérea) a la izquierda, pasos numerados a la derecha; en móvil se apilan. Estética de señalización vial. */
:root{
  --bg:#eef0ee;
  --surface:#ffffff;
  --ink:#1c2024;
  --muted:#5c646b;
  --line:#d5d9d6;
  --accent:#f2b705;        /* amarillo de demarcación */
  --accent-ink:#1c2024;
  --accent-soft:#fff3c4;
  --signal:#1f6f54;         /* verde cartel */
  --danger:#c2410c;
  --stage:#2a2e33;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15181b;--surface:#1e2226;--ink:#e9ece9;--muted:#9aa3a9;--line:#30363b;
  --accent:#f5c22b;--accent-ink:#15181b;--accent-soft:#3a3214;--signal:#4fbf93;--danger:#f08a4b;--stage:#22262a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15181b;--surface:#1e2226;--ink:#e9ece9;--muted:#9aa3a9;--line:#30363b;
  --accent:#f5c22b;--accent-ink:#15181b;--accent-soft:#3a3214;--signal:#4fbf93;--danger:#f08a4b;--stage:#22262a;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px}
.brand{display:flex;gap:14px;align-items:center}
.sign{width:46px;height:46px;border-radius:8px;background:#1f5fa8;color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1;border:3px solid #fff;box-shadow:0 0 0 2px #1f5fa8;flex:none}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);max-width:60ch}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font:600 15px var(--font-body);padding:9px 16px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab:focus-visible,.btn:focus-visible,.step:focus-visible,input:focus-visible{outline:3px solid var(--signal);outline-offset:2px}

.main{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}

.stage{background:var(--stage);border-radius:14px;overflow:hidden;position:relative;min-width:0}
.canvas-box{position:relative;width:100%;aspect-ratio:16/9;max-width:100%}
@media (max-width:600px){.canvas-box{aspect-ratio:4/3}}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:10px;top:10px;display:flex;gap:8px;align-items:stretch;pointer-events:none;flex-wrap:wrap;max-width:calc(100% - 72px)}
.fs-toggle{position:absolute;right:10px;top:10px;z-index:3;appearance:none;border:0;background:rgba(18,20,23,.82);color:#f1f3f1;border-radius:9px;height:40px;min-width:40px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 13px var(--font-body);cursor:pointer;backdrop-filter:blur(4px)}
.fs-toggle svg{width:18px;height:18px}
.fs-toggle .lbl{display:none}
.fs-toggle:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:600px){.fs-toggle{top:auto;bottom:10px}.fs-toggle .lbl{display:inline}.hud{max-width:calc(100% - 20px)}}
.chip{background:rgba(18,20,23,.82);color:#f1f3f1;border-radius:9px;padding:6px 10px;display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px;backdrop-filter:blur(4px)}
.gear{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1;min-width:22px;text-align:center}
.gear.r{color:#ff8a65}.gear.d{color:#7ee2b0}.gear.p{color:#9ec5ff}
.wheel{width:34px;height:34px;transition:none}
.chip small{display:block;color:#a9b1b6;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.blink{width:14px;height:14px;opacity:.25}
.blink.on{opacity:1}
.caption{position:absolute;left:10px;right:10px;bottom:10px;pointer-events:none;display:flex;justify-content:flex-start}
.caption span{background:rgba(18,20,23,.82);color:#fff;border-left:4px solid var(--accent);padding:6px 10px;border-radius:4px;font-size:13px;font-weight:500;max-width:100%}
/* Paso actual (solo en pantallas angostas, donde la lista queda lejos) */
.now{display:none;background:var(--surface);border-top:1px solid var(--line);padding:12px;gap:10px;grid-template-columns:30px minmax(0,1fr)}
.now .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:18px;background:var(--accent);color:var(--accent-ink)}
.now .t{font-weight:700;line-height:1.3}
.now .d{font-size:14px;margin-top:2px}
.now .r{margin-top:8px;font-size:13px;background:var(--accent-soft);border-radius:6px;padding:7px 9px}
@media (max-width:900px){.now{display:grid}}
@media (max-width:600px){.tabs{width:100%}.tab{flex:1;justify-content:center}.opt-toggles{width:100%;justify-content:space-between}}
/* Pantalla completa */
.stage.fs{position:fixed;z-index:1000;top:0;left:0;width:100vw;height:100vh;border-radius:0;display:flex;flex-direction:column;background:#16191c;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.stage.fs.rot{transform-origin:top left;padding:0 env(safe-area-inset-bottom,0px) 0 env(safe-area-inset-top,0px)}
.stage.fs .canvas-box{flex:1 1 auto;aspect-ratio:auto;min-height:0}
.stage.fs .controls{--line:#3a4046;--bg:#262b30;--ink:#e9ece9;--surface:#1b1f23;--muted:#9aa3a9;color:#e9ece9;background:#1b1f23;border-top-color:#2f353a;padding:4px 12px 8px;gap:2px}
.stage.fs .controls .row{flex-wrap:nowrap}
.stage.fs .btn{min-height:34px;padding:5px 10px}
.stage.fs .opt-toggles,.stage.fs .now{display:none}
.stage.fs .caption{display:flex;bottom:8px}
.stage.fs .hud{top:10px;max-width:calc(100% - 150px)}
.stage.fs .fs-toggle{top:10px;bottom:auto}
.stage.fs .fs-toggle .lbl{display:inline}
html.fs-lock,html.fs-lock body{overflow:hidden}
@media (max-width:600px){.caption{display:none}.chip{padding:4px 7px;font-size:11px}.gear{font-size:20px}.wheel{width:28px;height:28px}}

.controls{background:var(--surface);border-top:1px solid var(--line);padding:12px;display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 14px var(--font-body);border-radius:8px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-width:118px;justify-content:center}
.btn svg{width:16px;height:16px}
.spacer{flex:1}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--signal);width:16px;height:16px}
select.btn{padding-right:8px}
.scrub{position:relative;height:30px}
.scrub{touch-action:none;cursor:pointer}
.scrub input{position:absolute;inset:0;width:100%;margin:0;opacity:0;z-index:2;pointer-events:none}
.track{position:absolute;left:0;right:0;top:11px;height:8px;display:flex;gap:3px}
.track div{background:var(--line);border-radius:4px;position:relative;overflow:hidden;height:100%}
.track div i{position:absolute;inset:0;width:0;background:var(--accent);border-radius:4px}
.thumb{position:absolute;top:5px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translateX(-50%);pointer-events:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.panel h2{font-family:var(--font-display);font-size:24px;line-height:1.1;margin:0;font-weight:700}
.panel .lead{margin:0;color:var(--muted);font-size:14px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:10px;border-radius:10px;border:1px solid transparent;cursor:pointer;text-align:left;background:transparent;color:inherit;font:inherit;width:100%}
.step:hover{background:var(--bg)}
.step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:18px;border:2px solid var(--line);color:var(--muted)}
.step .t{font-weight:700;font-size:15px;line-height:1.3}
.step .d{color:var(--muted);font-size:14px;margin-top:2px}
.step .ref{display:none;margin-top:8px;font-size:13px;background:var(--accent-soft);border-radius:6px;padding:7px 9px;color:var(--ink)}
.step .ref b{font-weight:700}
.step.done .n{background:var(--signal);border-color:var(--signal);color:#fff}
.step.active{border-color:var(--accent);background:var(--bg)}
.step.active .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.active .d{color:var(--ink)}
.step.active .ref{display:block}

.extra{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.card h3{font-family:var(--font-display);font-size:20px;margin:0 0 8px;font-weight:700;letter-spacing:.01em}
.card ul{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--muted)}
.card li b{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:4px;border-radius:2px;display:inline-block}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<style>body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="sign" aria-hidden="true">E</div>
      <div>
        <h1>Escuela de Estacionamiento</h1>
        <p class="sub">Vista aérea de las dos maniobras, paso a paso. Tocá un paso para verlo, o reproducí la maniobra completa.</p>
      </div>
    </div>
    <div class="tabs" role="tablist" aria-label="Tipo de estacionamiento">
      <button class="tab" role="tab" id="tab-a45" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18M2 20l4-8M8 20l4-8M14 20l4-8"/></svg>En 45°</button>
      <button class="tab" role="tab" id="tab-par" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18h18"/><rect x="3" y="11" width="7" height="5" rx="1.5"/><rect x="14" y="11" width="7" height="5" rx="1.5"/></svg>En paralelo</button>
    </div>
  </header>

  <div class="main">
    <section class="stage" aria-label="Diagrama animado">
      <div class="canvas-box" id="box">
        <canvas id="cv" role="img" aria-label="Vista aérea de la maniobra"></canvas>
        <div class="hud">
          <div class="chip"><span class="gear d" id="gear">D</span><div><small>Marcha</small><span id="gearTxt">1ª</span></div></div>
          <div class="chip">
            <svg class="wheel" id="wheel" viewBox="-20 -20 40 40" aria-hidden="true">
              <circle r="17" fill="none" stroke="#e9ece9" stroke-width="4"/>
              <circle r="4.5" fill="#e9ece9"/>
              <path d="M-16 0H-4M4 0H16M0 4V16" stroke="#e9ece9" stroke-width="3.5"/>
              <rect x="-2" y="-19.5" width="4" height="5" rx="1" fill="#f5c22b"/>
            </svg>
            <div><small>Volante</small><span id="wheelTxt">centro</span></div>
          </div>
          <div class="chip">
            <svg class="blink" id="blinkL" viewBox="0 0 20 20"><path d="M2 10l8-7v4h8v6h-8v4z" fill="#ffb020"/></svg>
            <svg class="blink" id="blinkR" viewBox="0 0 20 20"><path d="M18 10l-8-7v4H2v6h8v4z" fill="#ffb020"/></svg>
            <div><small>Velocidad</small><span id="spd">0 km/h</span></div>
          </div>
        </div>
        <div class="caption"><span id="cap"></span></div>
        <button class="fs-toggle" id="fsBtn" type="button" aria-label="Pantalla completa">
          <svg id="fsIco" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
          <span class="lbl" id="fsLbl">Pantalla completa</span>
        </button>
      </div>
      <div class="controls">
        <div class="scrub">
          <div class="track" id="track"></div>
          <div class="thumb" id="thumb"></div>
          <input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="Línea de tiempo">
        </div>
        <div class="row">
          <button class="btn" id="prev" aria-label="Paso anterior"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
          <button class="btn primary" id="play"><svg viewBox="0 0 16 16" fill="currentColor" id="playIco"><path d="M4 2l10 6-10 6z"/></svg><span id="playTxt">Reproducir</span></button>
          <button class="btn" id="next" aria-label="Paso siguiente"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
          <button class="btn" id="restart" aria-label="Volver al inicio"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8a5 5 0 1 0 1.5-3.5M3 2v3h3"/></svg></button>
          <select class="btn" id="speed" aria-label="Velocidad de reproducción">
            <option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="2">2×</option>
          </select>
          <span class="spacer"></span>
          <span class="row opt-toggles">
            <label class="toggle"><input type="checkbox" id="optPause" checked>Pausa en cada paso</label>
            <label class="toggle"><input type="checkbox" id="optGhost" checked>Trayectoria</label>
          </span>
        </div>
      </div>
      <div class="now" id="now" aria-live="polite"><span class="n" id="nowN">1</span><div><div class="t" id="nowT"></div><div class="d" id="nowD"></div><div class="r" id="nowR"></div></div></div>
    </section>

    <aside class="panel" aria-live="polite">
      <div>
        <h2 id="pTitle"></h2>
        <p class="lead" id="pLead"></p>
      </div>
      <ol class="steps" id="steps"></ol>
      <div class="legend">
        <span><i class="sw" style="background:#f5c22b"></i>Referencia del paso</span>
        <span><i class="sw" style="background:#7ec8ff"></i>Recorrido del eje trasero</span>
      </div>
    </aside>
  </div>

  <div class="extra" id="extra"></div>
</div>

<script>
(()=>{
/* ---------- Geometría del auto (metros) ---------- */
const WB=2.6, LEN=4.4, W=1.8, RO=0.9;        // distancia entre ejes, largo, ancho, voladizo trasero
const RATIO=15;                               // relación de dirección (volante:ruedas)
const D2R=Math.PI/180, A45=Math.PI/4;

function advance(p,s,k){
  if(!k) return {x:p.x+Math.cos(p.t)*s,y:p.y+Math.sin(p.t)*s,t:p.t};
  const t1=p.t+k*s;
  return {x:p.x+(Math.sin(t1)-Math.sin(p.t))/k, y:p.y-(Math.cos(t1)-Math.cos(p.t))/k, t:t1};
}
const toWorld=(p,lx,ly)=>({x:p.x+lx*Math.cos(p.t)-ly*Math.sin(p.t), y:p.y+lx*Math.sin(p.t)+ly*Math.cos(p.t)});

/* ---------- Escenarios ---------- */
// Convención: x hacia el este (sentido de circulación), y hacia abajo. Cordón en y=0, vereda debajo.
// Curvatura k>0 = volante a la derecha.

// Paralelo
const P_YF=-1.15, P_GAP=1.0, P_R=4.2;
const P_Y0=P_YF-W-P_GAP;                                   // carril de aproximación
const P_D=(P_YF-P_Y0-2*P_R*(1-Math.cos(A45)))/Math.sin(A45);
const P_XF=-5.75;
const P_X0=P_XF+2*P_R*Math.sin(A45)+P_D*Math.cos(A45);
const P_SPOT=[-7.0,0];                                     // hueco libre (paragolpes a paragolpes)

// 45°
const S45=2.5/Math.sin(A45);                              // separación de líneas sobre el cordón
// Lugares para entrar de cola: el auto queda mirando hacia la calle (rumbo -45°)
const spotPose=i=>{const mx=S45*i+S45/2; return {x:mx+1.53,y:-1.53,t:-A45};};
const A_R=4.5, A_Y0=-6.6;
const A_F=spotPose(0);
const A_D=(A_F.y-A_Y0-A_R*(1-Math.cos(A45)))/Math.sin(A45);
const A_X0=A_F.x+Math.sin(A45)*(A_R+A_D);

const SC={
 a45:{
  title:'Estacionar en 45° marcha atrás',
  lead:'Pasás el lugar, frenás y entrás de cola. Cuesta un poco más entrar, pero después salís de frente y viendo el tránsito.',
  view:{x0:-5.5,x1:18,y0:-10.6,y1:2.4},
  mview:{x0:-2,x1:15,y0:-8.4,y1:1.6},
  start:{x:A_X0-13,y:A_Y0,t:0},
  steps:[
   {t:'Señalizá y pasá el lugar',
    d:'Poné el señalero derecho y circulá despacio, a 1 m del frente de los autos estacionados. Pasá de largo el lugar libre y frená.',
    ref:'<b>Dónde frenar:</b> cuando tu paragolpes trasero pasó 1,5 m la punta de la línea más adelantada del lugar.',
    cap:'Pasá el lugar · paragolpes trasero 1,5 m después de la línea',
    segs:[{wait:0.8,blink:'R'},{move:13,k:0,blink:'R'},{wait:0.5,blink:'R'}],
    mark:'stop45'},
   {t:'Marcha atrás y volante a la derecha',
    d:'Poné la marcha atrás y girá el volante a la derecha, algo más de una vuelta. Retrocedé muy despacio: la cola entra en diagonal al lugar.',
    ref:'<b>Mirá el espejo derecho:</b> la esquina trasera derecha es la que pasa más cerca del auto de ese lado.',
    cap:'Marcha atrás · volante a la derecha',
    segs:[{wait:0.5,gear:'R',blink:'R'},{steer:1/A_R,dur:1.0,blink:'R'},{move:-A_R*A45,k:1/A_R,blink:'R'},{wait:0.3,blink:'R'}],
    mark:'arc45'},
   {t:'Enderezá y retrocedé recto',
    d:'Cuando el auto queda paralelo a las líneas, volvé el volante al centro y retrocedé derecho hasta el fondo del lugar.',
    ref:'<b>Comprobá en los dos espejos:</b> la misma distancia a cada línea, unos 35 cm hasta cada vecino.',
    cap:'Volante al centro · atrás derecho',
    segs:[{steer:0,dur:1.0},{move:-A_D,k:0}],
    mark:'center45'},
   {t:'Frená antes del cordón',
    d:'Detenete con la cola a unos 25 cm del cordón. Freno de mano, punto muerto y motor apagado.',
    ref:'<b>Ojo:</b> la cola sobresale casi un metro detrás de las ruedas traseras. Frená antes de que la rueda toque el cordón.',
    cap:'Freno de mano · listo',
    segs:[{wait:1.2,gear:'P'}],
    mark:'curb45'},
   {t:'Para salir: de frente',
    d:'Primera, avanzá derecho hasta que tu cola pase el frente de los vecinos y después girá el volante a la derecha para entrar al carril.',
    ref:'<b>La ventaja:</b> salís mirando hacia adelante, con el tránsito a la vista, en lugar de salir de cola a ciegas.',
    cap:'Salida: adelante derecho, luego volante a la derecha',
    segs:[{wait:0.5,gear:'D',blink:'L'},{move:4.5,k:0,blink:'L'},{steer:1/5.5,dur:0.9},{move:5.5*A45,k:1/5.5},{steer:0,dur:0.9},{move:5,k:0}],

/* ---------- Construcción de la línea de tiempo ---------- */
const V_FWD=1.6, V_REV=0.85;     // m/s (≈ 5,8 y 3 km/h)
function build(sc){
  let p={...sc.start}, k=0, gear='D', t=0;
  const segs=[];
  sc.steps.forEach((st,si)=>{
    st.t0=t;
    st.segs.forEach(s=>{
      const blink=s.blink||null;
      if(s.gear) gear=s.gear;
      if(s.wait!=null){segs.push({type:'wait',si,t0:t,t1:t+s.wait,p0:p,p1:p,k0:k,k1:k,gear,blink});t+=s.wait;}
      else if(s.steer!=null){segs.push({type:'steer',si,t0:t,t1:t+s.dur,p0:p,p1:p,k0:k,k1:s.steer,gear,blink});k=s.steer;t+=s.dur;}
      else {
        if(s.move<0) gear='R'; else if(gear!=='D') gear='D';
        const v=s.move<0?V_REV:V_FWD;
        const dur=Math.abs(s.move)/v*1.45+0.3;
        const p1=advance(p,s.move,s.k);
        segs.push({type:'move',si,t0:t,t1:t+dur,p0:p,p1,s:s.move,k:s.k,k0:s.k,k1:s.k,gear,blink});
        p=p1;t+=dur;
      }
    });
    st.t1=t; st.endPose=p;
  });
  sc.segs=segs; sc.total=t;
  // Muestreo del recorrido completo
  sc.path=[];
  for(let i=0;i<=600;i++){sc.path.push(stateAt(sc,sc.total*i/600).p);}
}
const ease=u=>u*u*u*(u*(u*6-15)+10);              // arranque y frenado suaves
const easeD=u=>30*u*u*(u-1)*(u-1);
function stateAt(sc,T){
  T=Math.max(0,Math.min(sc.total,T));
  let seg=sc.segs.find(s=>T<s.t1)||sc.segs[sc.segs.length-1];
  const u=(T-seg.t0)/Math.max(1e-6,seg.t1-seg.t0);
  let p=seg.p0,k=seg.k0,v=0,moving=false;
  if(seg.type==='move'){p=advance(seg.p0,seg.s*ease(u),seg.k);k=seg.k;v=Math.abs(seg.s)*easeD(u)/(seg.t1-seg.t0);moving=true;}
  else if(seg.type==='steer'){k=seg.k0+(seg.k1-seg.k0)*ease(u);}
  return {p,k,v,seg,u,moving,gear:seg.gear,blink:seg.blink,si:seg.si};
}

const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), box=document.getElementById('box');

  for(let i=0;i<9000;i++){const v=40+Math.random()*40|0;g.fillStyle=`rgba(${v+20},${v+22},${v+25},${Math.random()*.5})`;g.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*1.5,1+Math.random()*1.5);}
  for(let i=0;i<500;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*.25})`;g.fillRect(Math.random()*256,Math.random()*256,2,2);}

}
function resize(){

  view=(cw<640&&cur.mview)?cur.mview:cur.view;const v=view;const sw=cw/(v.x1-v.x0), sh=ch/(v.y1-v.y0);

   case 'center45':{const m={x:S45/2,y:0};dline(m.x,m.y,m.x+6,m.y-6,ACC,[0.4,0.3],0.06);label(m.x+5.6,m.y-5.6,'Centro del lugar',{dx:12});break;}
   case 'curb45':{const fc=toWorld(p,-RO,0.9);dim(fc.x,fc.y,fc.x,0,'≈ 25 cm',{dx:12,align:'left'});break;}
   case 'exit45':{if(s.si===st&&s.seg.t0-sc.steps[st].t0<4){label(8,-8.8,'Salís de frente, viendo el tránsito',{align:'center'});}break;}
   case 'align':{dline(0,-0.2,0,p.y-1.4);label(0,p.y-1.6,'Paragolpes traseros alineados',{align:'center',dy:-8});
     dim(P_SPOT[0],0.55,P_SPOT[1],0.55,'7 m ≈ 1,5 × largo del auto',{dy:16});
     const gy=P_YF-0.9;dim(2.3,gy,2.3,p.y+0.9,'1 m',{dx:10,align:'left'});break;}
   case 'angle':{worldT();const c=toWorld(p,-RO,0);ctx.strokeStyle=ACC;ctx.lineWidth=0.06;
     ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(c.x+3,c.y);ctx.stroke();
     ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(c.x+Math.cos(p.t)*3,c.y+Math.sin(p.t)*3);ctx.stroke();
     ctx.beginPath();ctx.arc(c.x,c.y,1.6,Math.min(0,p.t),Math.max(0,p.t));ctx.stroke();
     label(c.x+2.2,c.y-1.0,`${Math.round(Math.abs(p.t)/D2R)}°`,{size:14});
     const back={x:P_SPOT[0],y:P_YF-0.9};ring(back.x-0.6,back.y+0.3,0.55,ACC,pulse);label(back.x-0.6,back.y,'Frente del auto de atrás',{align:'center',dy:-26});break;}
   case 'corner':{const ac={x:0,y:P_YF-0.9};ring(ac.x,ac.y,0.35,ACC,pulse);dot(ac.x,ac.y,0.12);
     const fr=toWorld(p,LEN-RO,0.9);dot(fr.x,fr.y,0.12);label(ac.x,ac.y,'Tu esquina tiene que pasar este punto',{dx:14,dy:-20});break;}
   case 'swing':{const fl=toWorld(p,LEN-RO,-0.9);ring(fl.x,fl.y,0.45,'#ff8a65',pulse);label(fl.x,fl.y,'La trompa abre hacia la calle',{dx:14,dy:-18,fg:'#ffb199'});
     const rr=toWorld(p,-RO,0.9);dot(rr.x,rr.y,0.1);label(rr.x,rr.y,'Cola cerca del cordón',{dx:-14,dy:20,align:'right'});break;}
   case 'final':{const rb=p.x-RO, fb=p.x+LEN-RO;dim(P_SPOT[0],-1.15,rb,-1.15,'',{});dim(fb,-1.15,P_SPOT[1],-1.15,'',{});
     label((P_SPOT[0]+rb)/2,-2.6,`${(rb-P_SPOT[0]).toFixed(1).replace('.',',')} m`,{align:'center'});label((fb+P_SPOT[1])/2,-2.6,`${(P_SPOT[1]-fb).toFixed(1).replace('.',',')} m`,{align:'center'});
     dim(p.x+1.6,P_YF+0.9,p.x+1.6,0,'',{});label(p.x+1.6,0.6,'25 cm',{align:'center',dy:10});break;}
  }
}

function drawScene(clock){
  const sc=cur;const s=stateAt(sc,T);
  drawGround();
  if(sc===SC.a45) drawLines45();
  // autos estacionados
  if(sc===SC.a45){[-4,-3,-2,-1,1,2,4,5].forEach((i,j)=>drawCar(spotPose(i),{color:PALETTE[(j+2)%PALETTE.length]}));}
  else{drawCar({x:0.9,y:P_YF,t:0},{color:PALETTE[0]});drawCar({x:P_SPOT[0]-LEN+RO,y:P_YF,t:0},{color:PALETTE[2]});
       drawCar({x:5.9+RO,y:P_YF-0.05,t:0},{color:PALETTE[3]});drawCar({x:P_SPOT[0]-LEN-1.2-LEN+RO,y:P_YF+0.05,t:0},{color:PALETTE[6]});}
  // trayectoria
  if(optGhost.checked){
    worldT();ctx.lineWidth=0.07;ctx.strokeStyle='rgba(126,200,255,.25)';ctx.setLineDash([0.25,0.25]);
    ctx.beginPath();sc.path.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.stroke();ctx.setLineDash([]);
    const n=Math.round(T/sc.total*600);ctx.strokeStyle='rgba(126,200,255,.9)';ctx.lineWidth=0.08;
    ctx.beginPath();for(let i=0;i<=n;i++){const q=sc.path[i];i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);}ctx.stroke();
    // siluetas en el final de cada paso
    sc.steps.forEach((st,i)=>{if(i===sc.steps.length-1&&sc===SC.a45)return;const q=st.endPose;
      drawCar(q,{outline:true,color:i===s.si?'rgba(245,194,43,.9)':'rgba(255,255,255,.28)'});
      const c=toWorld(q,LEN/2-RO,0);screenT();const [x,y]=W2S(c.x,c.y);
      ctx.fillStyle=i===s.si?ACC:'rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fill();
      ctx.fillStyle='#16191c';ctx.font='700 12px "Barlow Condensed",sans-serif';ctx.textAlign='center';ctx.fillText(String(i+1),x,y+4);ctx.textAlign='left';});
  }
  // auto propio
  const blinkOn=!!s.blink && Math.floor(clock/380)%2===0;
  const steer=Math.atan(WB*s.k);
  drawCar(s.p,{color:'#d63a2f',steer,brake:!s.moving||s.u>0.8||s.u<0.08,reverse:s.gear==='R',blinkOn,blinkSide:s.blink,driver:true,xray:true});
  drawMarks(sc,s.si,s,clock);
  return s;
}

/* ---------- HUD y UI ---------- */
const $=id=>document.getElementById(id);
const gearEl=$('gear'),gearTxt=$('gearTxt'),wheel=$('wheel'),wheelTxt=$('wheelTxt'),spd=$('spd'),cap=$('cap'),bl=$('blinkL'),br=$('blinkR');
const optGhost=$('optGhost'),optPause=$('optPause');
function turnsText(deg){
  const a=Math.abs(deg);if(a<12)return 'centro';
  const q=Math.round(a/90)/4;const whole=Math.floor(q),frac=q-whole;
  const f={0:'',0.25:'¼',0.5:'½',0.75:'¾'}[frac.toFixed(2)*1]??'';
  const n=(whole?whole:'')+f||'¼';
  return `${n} vuelta${q>1?'s':''} ${deg>0?'der.':'izq.'}`;
}
let lastSi=-1;
function hud(s,clock){
  const g=s.gear==='R'?'R':s.gear==='P'?'P':'D';
  gearEl.textContent=g;gearEl.className='gear '+g.toLowerCase();
  gearTxt.textContent=g==='R'?'atrás':g==='P'?'freno mano':'1ª';
  const deg=Math.atan(WB*s.k)/D2R*RATIO;
  wheel.style.transform=`rotate(${deg}deg)`;wheelTxt.textContent=turnsText(deg);
  spd.textContent=`${(s.v*3.6).toFixed(0)} km/h`;
  const on=!!s.blink&&Math.floor(clock/380)%2===0;
  bl.classList.toggle('on',on&&s.blink==='L');br.classList.toggle('on',on&&s.blink==='R');
  if(s.si!==lastSi){lastSi=s.si;cap.textContent=`Paso ${s.si+1} · ${cur.steps[s.si].cap}`;
    {const st=cur.steps[s.si];$('nowN').textContent=s.si+1;$('nowT').textContent=st.t;$('nowD').textContent=st.d;$('nowR').innerHTML=st.ref;}
    document.querySelectorAll('.step').forEach((el,i)=>{el.classList.toggle('active',i===s.si);el.classList.toggle('done',i<s.si);el.setAttribute('aria-current',i===s.si?'step':'false');});}
  // barra de tiempo
  cur.steps.forEach((st,i)=>{const f=Math.max(0,Math.min(1,(T-st.t0)/(st.t1-st.t0)));trackFills[i].style.width=(f*100)+'%';});
  $('thumb').style.left=(T/cur.total*100)+'%';
  $('scrub').value=Math.round(T/cur.total*1000);
}

let cur=SC.a45, T=0, playing=false, speed=1, last=0, stopAt=null, trackFills=[];
function draw(clock=performance.now()){const s=drawScene(clock);hud(s,clock);}

function renderPanel(){
  $('pTitle').textContent=cur.title;$('pLead').textContent=cur.lead;
  const ol=$('steps');ol.innerHTML='';
  cur.steps.forEach((st,i)=>{const li=document.createElement('li');
    li.innerHTML=`<button class="step" type="button"><span class="n">${i+1}</span><span><span class="t">${st.t}</span><span class="d" style="display:block">${st.d}</span><span class="ref" style="display:none">${st.ref}</span></span></button>`;
    const b=li.firstChild;b.querySelector('.ref').removeAttribute('style');
    b.addEventListener('click',()=>{goStep(i,true);});ol.appendChild(li);});
  const tr=$('track');tr.innerHTML='';trackFills=[];
  cur.steps.forEach(st=>{const d=document.createElement('div');d.style.flex=(st.t1-st.t0)+' 1 0';const f=document.createElement('i');d.appendChild(f);tr.appendChild(d);trackFills.push(f);});
  $('extra').innerHTML=cur.tips.map(([h,items])=>`<div class="card"><h3>${h}</h3><ul>${items.map(([b,t])=>`<li><b>${b}:</b> ${t}</li>`).join('')}</ul></div>`).join('');
  lastSi=-1;
}
function setPlaying(v){playing=v;$('playTxt').textContent=v?'Pausa':(T>=cur.total-0.01?'Repetir':'Reproducir');
  $('playIco').innerHTML=v?'<path d="M3 2h4v12H3zM9 2h4v12H9z"/>':'<path d="M4 2l10 6-10 6z"/>';
  if(v){last=performance.now();requestAnimationFrame(loop);} }
function goStep(i,play){i=Math.max(0,Math.min(cur.steps.length-1,i));T=cur.steps[i].t0;stopAt=cur.steps[i].t1;lastSi=-1;draw();if(play&&!reduce)setPlaying(true);else if(reduce){T=cur.steps[i].t1-0.001;draw();setPlaying(false);}}
function loop(now){
  if(!playing){draw(now);return;}
  const dt=Math.min(0.05,(now-last)/1000);last=now;T+=dt*speed;
  if(optPause.checked&&stopAt==null){stopAt=cur.steps[stateAt(cur,T-dt*speed).si].t1;}
  if(stopAt!=null&&T>=stopAt-1e-6&&optPause.checked){T=stopAt-1e-6;stopAt=null;draw(now);setPlaying(false);
    if(T>=cur.total-0.01)$('playTxt').textContent='Repetir';else $('playTxt').textContent='Siguiente paso';return;}
  if(T>=cur.total){T=cur.total;draw(now);setPlaying(false);return;}
  draw(now);requestAnimationFrame(loop);
}
// parpadeo de señalero aunque esté en pausa
function idle(now){if(!playing)draw(now);setTimeout(()=>requestAnimationFrame(idle),120);}

$('play').addEventListener('click',()=>{
  if(playing){setPlaying(false);return;}
  if(T>=cur.total-0.01){T=0;}
  let si=stateAt(cur,T).si;
  if(cur.steps[si].t1-T<0.01&&si<cur.steps.length-1){si++;T=cur.steps[si].t0;}
  stopAt=optPause.checked?cur.steps[si].t1:null;setPlaying(true);
});
$('next').addEventListener('click',()=>{const si=stateAt(cur,T).si;goStep(si+1,true);});
$('prev').addEventListener('click',()=>{const si=stateAt(cur,T).si;const idx=(T-cur.steps[si].t0<0.5)?si-1:si;goStep(idx,true);});
$('restart').addEventListener('click',()=>{T=0;stopAt=null;lastSi=-1;draw();setPlaying(!reduce);});
$('speed').addEventListener('change',e=>speed=+e.target.value);
$('scrub').addEventListener('input',e=>{T=e.target.value/1000*cur.total;stopAt=null;if(playing)setPlaying(false);draw();});
// Arrastre propio sobre la línea de tiempo (funciona también con la vista girada)
const scrubBox=document.querySelector('.scrub');
function scrubAt(ev){const r=scrubBox.getBoundingClientRect();const rot=stage.classList.contains('rot');
  const f=rot?(ev.clientY-r.top)/r.height:(ev.clientX-r.left)/r.width;
  T=Math.max(0,Math.min(1,f))*cur.total;stopAt=null;if(playing)setPlaying(false);draw();}
scrubBox.addEventListener('pointerdown',ev=>{scrubBox.setPointerCapture(ev.pointerId);scrubAt(ev);});
scrubBox.addEventListener('pointermove',ev=>{if(scrubBox.hasPointerCapture(ev.pointerId))scrubAt(ev);});

/* ---------- Pantalla completa ---------- */
const stage=document.querySelector('.stage');
let fsOn=false;
function layoutFs(){
  if(!fsOn){stage.classList.remove('rot');stage.style.width=stage.style.height=stage.style.transform='';return;}
  const w=window.innerWidth,h=window.innerHeight;
  const rot=h>w; // en vertical giramos la vista para que quede apaisada
  stage.classList.toggle('rot',rot);
  if(rot){stage.style.width=h+'px';stage.style.height=w+'px';stage.style.transform=`translateX(${w}px) rotate(90deg)`;}
  else{stage.style.width=w+'px';stage.style.height=h+'px';stage.style.transform='';}
  resize();
}
function setFsUi(){
  $('fsLbl').textContent=fsOn?'Salir':'Pantalla completa';
  $('fsBtn').setAttribute('aria-label',fsOn?'Salir de pantalla completa':'Pantalla completa');
  $('fsIco').innerHTML=fsOn?'<path d="M3 3l10 10M13 3L3 13"/>':'<path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/>';
}
async function enterFs(){
  fsOn=true;stage.classList.add('fs');document.documentElement.classList.add('fs-lock');setFsUi();layoutFs();
  try{if(stage.requestFullscreen&&!document.fullscreenElement)await stage.requestFullscreen({navigationUI:'hide'});}catch(e){}
  let locked=false;
  try{if(screen.orientation&&screen.orientation.lock){await screen.orientation.lock('landscape');locked=true;}}catch(e){}
  // Si el navegador no deja girar la pantalla, salimos del modo nativo (que impide rotar la vista) y giramos nosotros
  const fallback=async()=>{if(fsOn&&document.fullscreenElement&&window.innerHeight>window.innerWidth){stage.dataset.native='';try{await document.exitFullscreen();}catch(e){}}layoutFs();};
  if(!locked)await fallback(); else setTimeout(fallback,700);
  layoutFs();
}
function exitFs(){
  if(!fsOn)return;fsOn=false;
  try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});}catch(e){}
  try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock();}catch(e){}
  stage.classList.remove('fs');document.documentElement.classList.remove('fs-lock');setFsUi();layoutFs();resize();
}
$('fsBtn').addEventListener('click',()=>fsOn?exitFs():enterFs());
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&fsOn&&stage.dataset.native==='1'){stage.dataset.native='';exitFs();}else if(document.fullscreenElement)stage.dataset.native='1';});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&fsOn)exitFs();});
window.addEventListener('resize',()=>{if(fsOn)layoutFs();});
window.addEventListener('orientationchange',()=>setTimeout(()=>{if(fsOn)layoutFs();},250));
optGhost.addEventListener('change',()=>draw());

function selectScenario(key){
  cur=SC[key];T=0;stopAt=null;setPlaying(false);
  $('tab-a45').setAttribute('aria-selected',key==='a45');$('tab-par').setAttribute('aria-selected',key==='par');
  renderPanel();resize();
  try{localStorage.setItem('estac-tab',key);}catch(e){}
  if(!reduce)setTimeout(()=>{if(!playing&&T===0)setPlaying(true);},500);
}
$('tab-a45').addEventListener('click',()=>selectScenario('a45'));
$('tab-par').addEventListener('click',()=>selectScenario('par'));

const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
build(SC.a45);build(SC.par);
new ResizeObserver(()=>resize()).observe(box);
let initial='a45';try{initial=localStorage.getItem('estac-tab')||'a45';}catch(e){}
if(location.hash==='#paralelo')initial='par';
if(!SC[initial])initial='a45';
selectScenario(initial);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>draw());
requestAnimationFrame(idle);
})();
</script>
